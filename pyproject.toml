[project]
name = "emotion-hybrid"
version = "0.1.0"
description = "Bilingual emotion detection system using lexicon and TF-IDF features"
requires-python = ">=3.8"
dependencies = [
    "scikit-learn>=1.0.0",
    "pandas>=1.3.0",
    "numpy>=1.21.0",
    "datasets>=2.0.0",
    "emoji>=2.0.0",
    "joblib>=1.0.0",
    "scipy>=1.7.0",
]
# Optional: tensorflow-datasets>=4.0.0 (requires dm-tree which may have build issues on Python 3.14+)

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"


